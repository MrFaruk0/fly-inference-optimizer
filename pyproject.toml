[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tensorfly"
version = "0.1.0"
description = "TensorFly MaleCNS-scale connectome inference scaffolding"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
torch = ["torch>=2.0"]
inference = ["torch>=2.0", "transformers>=4.40", "accelerate>=0.27", "safetensors>=0.4"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
